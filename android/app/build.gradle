plugins { id 'com.android.application' }
def nativeSideBySide = providers.gradleProperty('nativeSideBySide').getOrElse('false').toBoolean()

android {
    namespace 'org.supermanreturns.mobile'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId nativeSideBySide ? 'org.supermanreturns.mobile.native' : 'org.supermanreturns.mobile'
        manifestPlaceholders = [appLabel: nativeSideBySide ? 'Superman Returns Nativo' : 'Superman Returns Mobile']
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName '0.1.0-dev'
        testInstrumentationRunner 'org.supermanreturns.mobile.DeviceSmoke'
        buildConfigField 'boolean', 'HAS_GAME_RUNTIME', file('libs/arm64-v8a/libsuperman_game.so').exists().toString()
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'; cppFlags '-std=c++20' } }
    }
    buildFeatures { buildConfig true }
    sourceSets.main.jniLibs.srcDir 'libs'
    externalNativeBuild { cmake { path '../../native/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
